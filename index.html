<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#090d0c"><title>Dead End: Last Signal</title><link rel="icon" href="favicon.ico"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="css/main.css"></head><body>
<main id="menu" class="screen active"><div class="brand"><small>UM JOGO ORIGINAL DE LUIS PAULO ALVES</small><h1>DEAD END <em>LAST SIGNAL</em></h1><p>O sinal caiu. A cidade não.</p></div><nav id="mainNav"><button data-action="play" class="primary">JOGAR</button><button data-panel="characters">PERSONAGENS</button><button data-panel="arsenal">ARSENAL</button><button data-panel="lab">LABORATÓRIO</button><button data-panel="bestiary">BESTIÁRIO</button><button data-panel="stats">ESTATÍSTICAS</button><button data-panel="achievements">CONQUISTAS</button><button data-panel="settings">CONFIGURAÇÕES</button><button data-panel="credits">CRÉDITOS</button></nav><footer>v1.0.0 • Desenvolvido por Luis Paulo Alves</footer></main>
